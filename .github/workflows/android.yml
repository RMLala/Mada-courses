name: Android build

on:
  push:
    branches:
      - android-build
      - premium-finalisation-20261123
  pull_request:
    branches:
      - android-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dépôt
        uses: actions/checkout@v4

      - name: Vérifier la structure du projet
        run: |
          test -f index.html || { echo "::error::index.html absent à la racine"; exit 1; }
          test -f settings.gradle || { echo "::error::settings.gradle manquant"; exit 1; }
          test -f build.gradle || { echo "::error::build.gradle racine manquant"; exit 1; }
          test -f app/build.gradle || { echo "::error::app/build.gradle manquant"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::Manifeste manquant"; exit 1; }

      - name: Copier l'application dans les assets Android
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Vérifier la syntaxe JavaScript embarquée
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)];
          if (!scripts.length) throw new Error('Aucun script inline trouvé');
          scripts.forEach((m, i) => new Function(m[1]));
          console.log('OK : syntaxe valide pour ' + scripts.length + ' script(s) inline');
          NODE

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
            packages: platform-tools

      - name: Licences et plateforme
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Décoder le keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 absent"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compiler les 4 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleApi23Debug assembleApi29Debug assembleApi23Release assembleApi29Release

      - name: Vérifier signatures et niveaux d'API
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          DBG=$(find app/build/outputs/apk -path '*debug*' -name '*.apk')
          REL=$(find app/build/outputs/apk -path '*release*' -name '*.apk')
          [ "$(echo "$DBG" | grep -c apk)" -eq 2 ] || { echo "::error::APK debug manquants"; exit 1; }
          [ "$(echo "$REL" | grep -c apk)" -eq 2 ] || { echo "::error::APK release manquants"; exit 1; }
          for apk in $REL; do
            "$BT/apksigner" verify "$apk" || { echo "::error::Signature invalide : $apk"; exit 1; }
            case "$apk" in
              *api23*) want=23 ;;
              *api29*) want=29 ;;
              *) echo "::error::Variante inconnue : $apk"; exit 1 ;;
            esac
            "$BT/aapt2" dump badging "$apk" | grep -q "sdkVersion:'$want'" \
              || { echo "::error::minSdk inattendu pour $apk (attendu $want)"; exit 1; }
            echo "OK : $apk (minSdk $want, signé)"
          done

      - name: Archiver les sources (sans secrets ni builds)
        run: |
          zip -rq mada-courses-android-sources.zip . \
            -x '.git/*' '.gradle/*' 'build/*' '*/build/*' \
               'local.properties' '*.jks' '*.keystore' \
               'mada-courses-android-sources.zip'
          if unzip -l mada-courses-android-sources.zip | grep -Eq '\.jks|\.keystore|local\.properties|/build/'; then
            echo "::error::Fichier sensible ou de build présent dans l'archive"; exit 1
          fi

      - name: Artefact APK debug
        uses: actions/upload-artifact@v4
        with:
          name: mada-courses-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk

      - name: Artefact APK release signés
        uses: actions/upload-artifact@v4
        with:
          name: mada-courses-release-apk
          path: app/build/outputs/apk/**/release/*.apk

      - name: Artefact sources
        uses: actions/upload-artifact@v4
        with:
          name: mada-courses-android-sources
          path: mada-courses-android-sources.zip
