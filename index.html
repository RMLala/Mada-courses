<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MADA COURSES PRO</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--text:#1c2320;--muted:#66716b;--accent:#16865a;--soft:#e4f3ec;--danger:#c93c3c;--line:#dfe5e0;--warn:#b7791f;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111513;--card:#1a201c;--text:#e6ebe7;--muted:#97a39b;--accent:#3fc08a;--soft:#1f3a2c;--danger:#ff7070;--line:#2a332d;--warn:#f0ad4e}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{margin:0;font-size:18px;color:var(--accent)}
header small{color:var(--muted)}
main{padding:14px;max-width:820px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav{overflow-x:auto}nav button{flex:1 1 0;min-width:0;border:0;background:none;color:var(--muted);padding:8px 4px;font-size:11px;cursor:pointer}
nav button.on{color:var(--accent);font-weight:600}
nav button span{display:block;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:16px;margin-top:4px}
.muted,.kpi small{color:var(--muted);font-size:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.dng{color:var(--danger)}
button.sm{padding:4px 8px;font-size:13px}
input,select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);max-width:100%}
input.q{width:72px}
input.p{width:112px}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row .grow{flex:1;min-width:120px}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.add input,.add select{flex:1;min-width:110px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.warn{color:var(--warn)}
.tag{font-size:11px;background:var(--soft);color:var(--accent);padding:2px 6px;border-radius:6px}
.lbl{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13px;color:var(--muted)}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:14px 0 6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%}
.toast.on{opacity:1}
:root[data-theme="dark"]{--bg:#111513;--card:#1a201c;--text:#e6ebe7;--muted:#97a39b;--accent:#3fc08a;--soft:#1f3a2c;--danger:#ff7070;--line:#2a332d;--warn:#f0ad4e}
:root[data-theme="light"]{--bg:#f4f6f3;--card:#fff;--text:#1c2320;--muted:#66716b;--accent:#16865a;--soft:#e4f3ec;--danger:#c93c3c;--line:#dfe5e0;--warn:#b7791f}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);border-radius:16px}
header{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:color-mix(in srgb,var(--card) 88%,transparent)}
nav{box-shadow:0 -6px 24px rgba(0,0,0,.07);justify-content:space-around;padding:4px 6px}
nav button{border-radius:12px;transition:background .15s,color .15s;min-width:60px}
nav button.on{background:var(--soft)}
nav button span{transition:transform .15s}
nav button.on span{transform:translateY(-1px)}
button{transition:transform .08s,background .15s}
button:active{transform:scale(.97)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
h2{letter-spacing:-.01em}
main{padding:16px 14px 24px}
.app-header{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:64px}
.app-header .menu-trigger,.app-header .header-settings{width:42px;height:42px;border:0;border-radius:13px;background:var(--soft);color:var(--accent);font-size:21px;display:grid;place-items:center;padding:0;flex:0 0 auto}
.brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#16865a,#0d6045);display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 5px 14px rgba(22,134,90,.22)}
.brand-copy{flex:1;min-width:0}.brand-copy h1{font-size:16px;letter-spacing:.04em}.brand-copy small{font-size:11px}
.menu-shade{position:fixed;inset:0;background:rgba(10,20,15,.42);z-index:19;opacity:0;visibility:hidden;transition:.2s}
.side-menu{position:fixed;z-index:20;top:0;bottom:0;left:0;width:min(82vw,320px);padding:calc(22px + env(safe-area-inset-top)) 14px 22px;background:var(--card);box-shadow:18px 0 50px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto}
body.menu-open .side-menu{transform:translateX(0)}body.menu-open .menu-shade{opacity:1;visibility:visible}
.menu-head{padding:12px 12px 20px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}.menu-head b{color:var(--accent);letter-spacing:.04em}.menu-head small{color:var(--muted)}
.side-link{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;background:transparent;padding:12px;border-radius:12px;color:var(--text);font-size:14px;margin:2px 0}
.side-link.active{background:var(--soft);color:var(--accent);font-weight:700}.side-link .side-icon{width:24px;text-align:center;font-size:18px}
nav button{min-height:54px}
@media(min-width:700px){.side-menu{width:300px}main{padding-left:22px;padding-right:22px}}

.product-line{display:grid;grid-template-columns:auto minmax(70px,1fr) repeat(2,minmax(62px,86px)) minmax(72px,92px) auto;gap:6px;align-items:end}.price-field{display:flex;flex-direction:column;gap:3px;min-width:0;color:var(--muted);font-size:10px}.price-field input{width:100%;min-width:0;padding:8px 6px;font-size:14px}.line-total{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}.line-total-wrap{grid-column:2/-2;text-align:right}.catalog-tools{display:grid;grid-template-columns:1fr minmax(120px,.7fr);gap:8px;margin-top:10px}.catalog-tools input,.catalog-tools select{width:100%;min-width:0}.product-admin{padding:6px 0;border-top:1px solid var(--line)}.product-admin .add{display:grid;grid-template-columns:1.2fr 1fr .7fr .8fr auto}.product-admin input,.product-admin select{width:100%;min-width:0}.brand-mark.has-photo{overflow:hidden}.brand-mark img{width:100%;height:100%;object-fit:cover}.pin-lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}.pin-lock[hidden]{display:none}.pin-box{width:min(100%,360px);padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--card);display:grid;gap:12px}.pin-box input{width:100%;text-align:center;letter-spacing:.3em;font-size:22px}@media(max-width:480px){.product-line{grid-template-columns:auto minmax(65px,1fr) repeat(2,minmax(60px,1fr))}.product-line .line-total-wrap{grid-column:2/4;text-align:left}.product-admin .add{grid-template-columns:1fr 1fr}.catalog-tools{grid-template-columns:1fr}}

.product-line{display:grid;grid-template-columns:auto minmax(70px,1fr) repeat(2,minmax(62px,86px)) minmax(72px,92px) auto;gap:6px;align-items:end}.price-field{display:flex;flex-direction:column;gap:3px;min-width:0;color:var(--muted);font-size:10px}.price-field input{width:100%;min-width:0;padding:8px 6px;font-size:14px}.line-total{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}.line-total-wrap{grid-column:2/-2;text-align:right}.catalog-tools{display:grid;grid-template-columns:1fr minmax(120px,.7fr);gap:8px;margin-top:10px}.catalog-tools input,.catalog-tools select{width:100%;min-width:0}.product-admin{padding:6px 0;border-top:1px solid var(--line)}.product-admin .add{display:grid;grid-template-columns:1.2fr 1fr .7fr .8fr auto}.product-admin input,.product-admin select{width:100%;min-width:0}@media(max-width:480px){.product-line{grid-template-columns:auto minmax(65px,1fr) repeat(2,minmax(60px,1fr))}.product-line .line-total-wrap{grid-column:2/4;text-align:left}.product-admin .add{grid-template-columns:1fr 1fr}.catalog-tools{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="app-header"><button class="menu-trigger" type="button" aria-label="Ouvrir le menu" data-act="menuToggle">☰</button><div class="brand-mark" id="brandMark">🛒</div><div class="brand-copy"><h1 id="brandTitle">MADA COURSES</h1><small>Gestion du foyer · Premium</small></div><button class="header-settings" type="button" aria-label="Réglages" data-act="tab" data-v="reglages">⚙</button></header>
<div id="menuShade" class="menu-shade" data-act="menuClose"></div><aside id="sideMenu" class="side-menu" aria-label="Navigation principale"><div class="menu-head"><b>MADA COURSES PRO</b><small>Votre gestion au quotidien</small></div><div id="sideLinks"></div></aside>
<main id="app"></main>
<nav id="nav"></nav>
<div id="pinLock" class="pin-lock" hidden><div class="pin-box"><h2>Application verrouillée</h2><p class="muted">Saisis ton PIN pour continuer.</p><input id="unlockPin" type="password" inputmode="numeric" maxlength="8" placeholder="Code PIN"><button class="pri" id="unlockPinBtn">Déverrouiller</button><button id="unlockBioBtn" hidden onclick="window.AndroidBridge&&window.AndroidBridge.authenticateBiometric&&window.AndroidBridge.authenticateBiometric()">Utiliser la biométrie</button><p id="pinError" class="warn"></p></div></div>
<div id="toast" class="toast"></div>
<datalist id="units"></datalist>
<script>
const KEY='madaCoursesPro.v1';
const PERIODS={matin:'Matin',dejeuner:'Déjeuner',apresmidi:'Après-midi',soir:'Soir',nuit:'Nuit',hors:'Hors horaires'};
const PORDER=Object.keys(PERIODS);
const PLACES={marche:'Marché (tsena)',epicerie:'Épicerie de quartier',ambulant:'Marchand ambulant',independant:'Vendeur indépendant',supermarche:'Supermarché',magasin:'Magasin spécialisé',autre:'Autre'};
const MKIND={matin:'Achat du matin',dejeuner:'Achat du déjeuner',apresmidi:'Après-midi',soir:'Achat du soir',quotidien:'Quotidien',hebdo:'Hebdomadaire',mensuel:'Mensuel',exceptionnel:'Exceptionnel',autre:'Autre'};
const CATS=['Riz et céréales','Légumes','Fruits','Viandes','Poissons et fruits de mer','Produits laitiers','Épicerie','Huiles et condiments','Boissons',"Produits d'entretien",'Hygiène et beauté','Gaz et combustibles','Autres'];
const UNITS=['kg','demi-kg','g','L','pièce','kapoaka','daba','sobika','tas','botte','sachet','paquet','bouteille'];
const TABS=[['accueil','🏠','Accueil'],['budget','💰','Budget'],['courses','🛒','Courses'],['modeles','📋','Modèles'],['historique','🕘','Historique'],['stocks','📦','Stocks'],['catalogue','🏷️','Produits'],['rapports','📊','Rapports']];

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const iso=(off=0)=>{const d=new Date();d.setDate(d.getDate()+off);return ymd(d)};
const fdate=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const money=n=>Math.round(Number(n)||0).toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,' ')+' Ar';
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const ITEM=(name,qty,unit,est,cat,price=null,bought=false)=>({id:uid(),name,qty,unit,est,cat,price,bought});
const strip=items=>items.map(i=>({id:uid(),name:i.name,qty:i.qty,unit:i.unit,est:i.est,cat:i.cat,price:null,bought:false}));
const periodOf=m=>PERIODS[m.kind]?m.kind:'hors';
const spent=items=>items.reduce((s,i)=>s+(i.bought&&i.price!=null?i.qty*i.price:0),0);
const estimated=items=>items.reduce((s,i)=>s+i.qty*i.est,0);
const lines=cs=>cs.flatMap(c=>c.items.filter(i=>i.bought&&i.price!=null).map(i=>({c,i,amt:i.qty*i.price})));
const sumBy=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x)||'—';m[k]=(m[k]||0)+x.amt});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const kpi=(label,value)=>`<div class="kpi"><small>${label}</small><b>${value}</b></div>`;
const bars=(en,tot)=>en.length?en.map(([k,v])=>{const p=tot?Math.round(v/tot*100):0;return `<div class="row"><div class="grow">${esc(k)}<div class="bar"><i style="width:${p}%"></i></div></div><b>${money(v)}</b><small class="muted">${p}%</small></div>`}).join(''):'<div class="empty">Aucune dépense</div>';
const monthRange=off=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);const y=d.getFullYear(),m=d.getMonth();return{from:ymd(new Date(y,m,1)),to:ymd(new Date(y,m+1,0))}};

/* ---------- stockage ---------- */
function seed(){return{v:3,settings:{budgetMensuel:0},models:[],courses:[],remises:[],stocks:[],shops:[],cats:CATS.slice(),products:[]}}
function demo(){const o=demoData();o.stocks=[];o.shops=[];o.cats=CATS.slice();return o}
function demoData(){
  return{v:1,settings:{budgetMensuel:600000},
    models:[
      {id:uid(),name:'Achat du matin',kind:'matin',notes:'Pain et lait',items:[ITEM('Pain',10,'pièce',500,'Épicerie'),ITEM('Lait',1,'L',4500,'Produits laitiers')]},
      {id:uid(),name:'Achat du soir',kind:'soir',notes:'',items:[ITEM('Riz',5,'kg',3000,'Riz et céréales'),ITEM('Oignon',1,'kapoaka',1000,'Légumes')]},
      {id:uid(),name:'Achat hebdomadaire',kind:'hebdo',notes:'',items:[ITEM('Huile',1,'L',6000,'Huiles et condiments'),ITEM('Savon',2,'pièce',1500,"Produits d'entretien")]}],
    courses:[{id:uid(),date:iso(-1),period:'matin',place:'marche',lieu:'Tsena Analakely',notes:'Donnée de démo',demo:true,
      items:[ITEM('Riz',5,'kg',3000,'Riz et céréales',2800,true),ITEM('Tomate',2,'kapoaka',1200,'Légumes',1400,true),ITEM('Poisson',1,'kg',12000,'Poissons et fruits de mer',11000,true)]}],
    remises:[{id:uid(),date:iso(-2),amount:200000,comment:'Remise de démo'}]};
}
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);o.stocks=o.stocks||[];o.shops=o.shops||[];o.cats=o.cats||CATS.slice();o.remises=o.remises||[];o.courses=o.courses||[];o.models=o.models||[];o.settings=o.settings||{budgetMensuel:0};o.products=o.products||[];return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));autoSnap()}catch(e){toast('Sauvegarde impossible sur cet appareil')}}

/* ---------- état ---------- */
let db=load();
let pending=null;
let ui={tab:'accueil',courseId:null,modelId:null,updFor:null,catQ:'',filter:{period:'',place:''},rpt:monthRange(0)};
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
function sure(key){if(pending===key){pending=null;return true}pending=key;toast('Touchez à nouveau pour confirmer');setTimeout(()=>{if(pending===key)pending=null},4000);return false}
function owner(kind,id){return kind==='course'?db.courses.find(c=>c.id===id):db.models.find(m=>m.id===id)}
function makeCourse(date,period,items){const c={id:uid(),date,period,place:'marche',lieu:'',notes:'',items};db.courses.push(c);return c}
function openC(c){ui.tab='courses';ui.courseId=c.id}

/* ---------- vues ---------- */
function courseRow(c){
  const tot=spent(c.items);
  return `<div class="row" style="border:0;padding:0"><div class="grow"><b>${PERIODS[c.period]||esc(c.period)}</b> · ${fdate(c.date)} ${c.demo?'<span class="tag">démo</span>':''}<div class="muted">${esc(PLACES[c.place]||'')}${c.lieu?' — '+esc(c.lieu):''} · ${c.items.length} produit(s)</div></div><b>${money(tot)}</b></div>`;
}
function courseCard(c){return `<div class="card" style="cursor:pointer" data-act="openCourse" data-id="${c.id}">${courseRow(c)}</div>`}
function itemRow(i,kind,owner){
 const dd=`data-kind="${kind}" data-owner="${owner}" data-iid="${i.id}"`,check=kind==='course'?`<input type="checkbox" ${i.bought?'checked':''} data-set="item" data-f="bought" ${dd}>`:'';
 const paid=kind==='course'?`<label class="price-field"><small>PU payé</small><input class="p" type="number" min="0" step="any" value="${i.price??''}" placeholder="PU payé" data-set="item" data-f="price" ${dd}></label>`:'';
 const total=kind==='course'?`<span class="line-total" data-line-total="${i.id}">${money(i.bought&&i.price!=null?i.qty*i.price:0)}</span>`:'';
 return `<div class="row product-line">${check}<div class="grow"><b>${esc(i.name)}</b><div class="muted">${esc(i.cat)} · ${esc(i.unit)}</div></div><label class="price-field"><small>Qté</small><input class="q" type="number" min="0" step="any" value="${i.qty}" data-set="item" data-f="qty" ${dd}></label><label class="price-field"><small>PU estimé</small><input class="p" type="number" min="0" step="any" value="${i.est}" data-set="item" data-f="est" ${dd}></label>${paid}<span class="line-total-wrap">${total}</span><button class="sm dng" data-act="delItem" ${dd}>✕</button></div>`;
}
function addForm(kind,id){
 const opts=(db.products||[]).map(p=>`<option value="${esc(p.name)}"></option>`).join('');
 return `<div class="product-add"><label class="lbl">Produit — rechercher dans le catalogue<input id="n_name" list="productNames" autocomplete="off" placeholder="Rechercher ou saisir un produit"><datalist id="productNames">${opts}</datalist></label><div class="add"><label class="price-field"><small>Quantité</small><input id="n_qty" type="number" min="0.01" step="any" value="1"></label><label class="price-field"><small>Unité</small><input id="n_unit" list="units" value="kg"></label><label class="price-field"><small>PU estimé</small><input id="n_est" type="number" min="0" step="any" placeholder="Prix unitaire"></label><select id="n_cat">${cats().map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="pri" data-act="addItem" data-kind="${kind}" data-owner="${id}">Ajouter</button></div><p class="muted" id="productMatchHint">Le produit existant sera reconnu automatiquement.</p></div>`;
}
function vAccueil(){
  const t=iso(),m=t.slice(0,7);
  const today=db.courses.filter(c=>c.date===t).sort((a,b)=>PORDER.indexOf(a.period)-PORDER.indexOf(b.period));
  const month=db.courses.filter(c=>c.date.startsWith(m));
  const depT=today.reduce((s,c)=>s+spent(c.items),0);
  const depM=month.reduce((s,c)=>s+spent(c.items),0);
  const remis=db.remises.reduce((s,r)=>s+r.amount,0);
  const depAll=db.courses.reduce((s,c)=>s+spent(c.items),0);
  const bm=db.settings.budgetMensuel;
  const top=sumBy(lines(month),x=>x.i.cat)[0];
  const quick=['matin','dejeuner','soir'].map(p=>`<button class="pri" data-act="quick" data-period="${p}">${PERIODS[p]}</button>`).join('');
  return `<h2>Bonjour · ${fdate(t)}</h2>
  <div class="actions">${quick}<button data-act="newCourse">+ Nouvelle course</button></div>
  <div class="kpis" style="margin-top:12px">
    ${kpi("Dépensé aujourd'hui",money(depT))}
    ${kpi('Dépensé ce mois',money(depM))}
    ${kpi('Budget mensuel restant',bm?money(bm-depM):'Non défini')}
    ${kpi('Reliquat (remis − dépensé)',money(remis-depAll))}
    ${kpi('Courses ce mois',month.length)}
    ${kpi('Catégorie la plus coûteuse',top?esc(top[0])+' · '+money(top[1]):'—')}
  </div>
  ${bm&&depM>bm?`<div class="card warn" style="margin-top:12px">⚠ Budget mensuel dépassé de ${money(depM-bm)}.</div>`:''}
  <h3>Courses d'aujourd'hui</h3>
  ${today.length?today.map(courseCard).join(''):'<div class="card empty">Aucune course aujourd\'hui. Touchez « Achat du matin » pour commencer.</div>'}`;
}
function vCourses(){
  if(ui.courseId){const c=db.courses.find(x=>x.id===ui.courseId);if(c)return vCourse(c);ui.courseId=null}
  const list=[...db.courses].sort((a,b)=>b.date.localeCompare(a.date)||PORDER.indexOf(a.period)-PORDER.indexOf(b.period));
  return `${globalKpi()}<div class="actions"><button class="pri" data-act="newCourse">+ Nouvelle course</button></div>

function vRapports(){
  const r=ui.rpt;
  const cs=db.courses.filter(c=>c.date>=r.from&&c.date<=r.to);
  const L=lines(cs), tot=L.reduce((s,x)=>s+x.amt,0);
  const days=Math.max(1,Math.round((Date.parse(r.to)-Date.parse(r.from))/864e5)+1);
  const dayTot={};L.forEach(x=>dayTot[x.c.date]=(dayTot[x.c.date]||0)+x.amt);
  const dayKeys=Object.keys(dayTot).sort(), dmax=Math.max(1,...Object.values(dayTot));
  const evo=dayKeys.map(k=>`<div class="row"><div class="grow">${fdate(k)}<div class="bar"><i style="width:${Math.round(dayTot[k]/dmax*100)}%"></i></div></div><b>${money(dayTot[k])}</b></div>`).join('')||'<div class="empty">Aucune dépense sur la période</div>';
  const per=PORDER.map(p=>[PERIODS[p],L.filter(x=>x.c.period===p).reduce((s,x)=>s+x.amt,0)]).filter(x=>x[1]>0);
  const prod={};L.forEach(x=>{const k=x.i.name.trim().toLowerCase();prod[k]=prod[k]||{n:x.i.name,amt:0,q:0,buys:0};prod[k].amt+=x.amt;prod[k].q+=x.i.qty;prod[k].buys++});
  const topP=Object.values(prod).sort((a,b)=>b.amt-a.amt).slice(0,10).map(p=>[`${p.n} (${p.q} u, ${p.buys} achat(s))`,p.amt]);
  const f0=new Date(r.from+'T12:00:00'), plen=days;
  const pTo=ymd(new Date(f0-864e5)), pFrom=ymd(new Date(f0-plen*864e5));
  const prevTot=lines(db.courses.filter(c=>c.date>=pFrom&&c.date<=pTo)).reduce((s,x)=>s+x.amt,0);
  const dlt=prevTot?Math.round((tot-prevTot)/prevTot*100):null;
  const cmp=`<div class='card'><h3>Comparaison avec la période précédente</h3>Précédente : ${money(prevTot)} · actuelle : ${money(tot)} · ${dlt===null?'pas de référence':(dlt>=0?'+':'')+dlt+' %'}</div>`;
  const dim=new Date(+r.to.slice(0,4),+r.to.slice(5,7),0).getDate();
  const bm=db.settings.budgetMensuel;
  const prevu=bm&&r.from.slice(0,7)===r.to.slice(0,7)?bm*days/dim:0;
  return `<div class="card"><h2>Période</h2>
    <div class="kpis"><label class="lbl">Du<input type="date" value="${r.from}" data-set="rpt" data-f="from"></label><label class="lbl">Au<input type="date" value="${r.to}" data-set="rpt" data-f="to"></label></div>
    <div class="actions"><button data-act="rptDay">Aujourd'hui</button><button data-act="rptMonth" data-off="0">Ce mois</button><button data-act="rptMonth" data-off="-1">Mois précédent</button></div></div>
  <div class="kpis">${kpi('Total dépensé',money(tot))}${kpi('Moyenne quotidienne',money(tot/days))}${kpi('Courses',cs.length)}${kpi('Achats enregistrés',L.length)}</div>
  ${cmp}
  ${prevu?`<div class="card" style="margin-top:12px"><h3>Budget prévu / réalisé</h3>Prévu ${money(prevu)} · réalisé ${money(tot)} · écart ${money(prevu-tot)}</div>`:''}
  <h3>Évolution journalière</h3><div class="card">${evo}</div>
  <h3>Par moment de la journée</h3><div class="card">${bars(per,tot)}</div>
  <h3>Par catégorie</h3><div class="card">${bars(sumBy(L,x=>x.i.cat),tot)}</div>
  <h3>Par type de commerce</h3><div class="card">${bars(sumBy(L,x=>PLACES[x.c.place]),tot)}</div>
  <h3>Par lieu</h3><div class="card">${bars(sumBy(L,x=>x.c.lieu||PLACES[x.c.place]),tot)}</div>
  <h3>Top 10 des produits les plus coûteux</h3><div class="card">${bars(topP,tot)}</div>`;
}

const BK='madaCoursesPro.backups', LS='madaCoursesPro.lastSnap', LB='madaCoursesPro.lastBackup';
function cats(){return db.cats||CATS}
function globalKpi(){const rec=db.remises.reduce((s,r)=>s+r.amount,0),dep=db.courses.reduce((s,c)=>s+spent(c.items),0);return `<div class='kpis' style='margin-bottom:12px'>${kpi('Recettes (argent remis)',money(rec))}${kpi('D\u00e9penses totales',money(dep))}${kpi('Solde',money(rec-dep))}</div>`}
function autoSnap(){const last=+(localStorage.getItem(LS)||0);if(Date.now()-last<2*864e5)return;try{let arr=[];try{arr=JSON.parse(localStorage.getItem(BK)||'[]')}catch(e){}arr.unshift({at:Date.now(),data:JSON.stringify(db)});localStorage.setItem(BK,JSON.stringify(arr.slice(0,5)));localStorage.setItem(LS,String(Date.now()))}catch(e){}}
function backupDue(){return db.courses.length>0&&Date.now()-(+(localStorage.getItem(LB)||0))>2*864e5}
function bannerBackup(){return backupDue()?`<div class='card warn'>\ud83d\udcbe Sauvegarde recommand\u00e9e tous les 2 jours. <div class='actions'><button class='sm pri' data-act='exportJSON'>T\u00e9l\u00e9charger</button><button class='sm' data-act='dismissBackup'>Plus tard</button></div></div>`:''}
function download(name,type,text){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function exportJSON(){download('mada-courses-'+iso()+'.json','application/json',JSON.stringify(db,null,2));localStorage.setItem(LB,String(Date.now()));toast('Sauvegarde t\u00e9l\u00e9charg\u00e9e')}
function exportCSV(){const rows=[['date','moment','type_lieu','lieu','produit','categorie','quantite','unite','estime','paye','achete']];db.courses.forEach(c=>c.items.forEach(i=>rows.push([c.date,PERIODS[c.period]||c.period,PLACES[c.place]||'',c.lieu,i.name,i.cat,i.qty,i.unit,i.est,i.price??'',i.bought?'oui':'non'])));const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');download('mada-achats-'+iso()+'.csv','text/csv',csv);toast('Export CSV t\u00e9l\u00e9charg\u00e9')}
function reglagesExtra(){

  const snapTxt=snap?new Date(snap).toLocaleString('fr-FR'):'jamais';
  return `<div class='card'><h3>Sauvegarde et restauration</h3><p class='muted'>Sauvegarde automatique dans le navigateur tous les 2 jours (5 derni\u00e8res conserv\u00e9es). Derni\u00e8re sauvegarde automatique : ${snapTxt}. Dernier fichier t\u00e9l\u00e9charg\u00e9 : ${lastTxt}.</p>

function prodManager(){
 const products=db.products||[],q=(ui.productQ||'').toLocaleLowerCase('fr').trim(),sort=ui.productSort||'name';
 const list=products.filter(p=>!q||[p.name,p.cat,p.unit].join(' ').toLocaleLowerCase('fr').includes(q)).sort((a,b)=>sort==='price'?(Number(b.ref)||0)-(Number(a.ref)||0):sort==='category'?String(a.cat).localeCompare(String(b.cat),'fr'):a.name.localeCompare(b.name,'fr'));
 return `<div class="card"><h3>Mes produits</h3><p class="muted">Catalogue réutilisable, modifiable directement, avec recherche et tri.</p><div class="add"><input id="pr_n" placeholder="Nom du produit"><select id="pr_c">${cats().map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="pr_u" list="units" value="kg" placeholder="Unité"><input id="pr_p" type="number" min="0" step="any" placeholder="Prix de référence"><button class="pri" data-act="addProd">Créer</button></div><div class="catalog-tools"><input value="${esc(ui.productQ||'')}" data-set="productQ" placeholder="Rechercher nom, catégorie…"><select data-set="productSort"><option value="name" ${sort==='name'?'selected':''}>Tri : nom</option><option value="category" ${sort==='category'?'selected':''}>Tri : catégorie</option><option value="price" ${sort==='price'?'selected':''}>Tri : prix décroissant</option></select></div><p class="muted">${list.length} / ${products.length} produit(s)</p>${list.map(p=>`<div class="product-admin"><div class="add"><input aria-label="Nom" value="${esc(p.name)}" data-set="prod" data-f="name" data-owner="${p.id}"><select aria-label="Catégorie" data-set="prod" data-f="cat" data-owner="${p.id}">${cats().map(c=>`<option ${c===p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><input aria-label="Unité" value="${esc(p.unit)}" data-set="prod" data-f="unit" data-owner="${p.id}"><input aria-label="Prix de référence" type="number" min="0" step="any" value="${Number(p.ref)||0}" data-set="prod" data-f="ref" data-owner="${p.id}"><button class="sm dng" data-act="delProd" data-id="${p.id}">Supprimer</button></div></div>`).join('')||'<div class="empty">Aucun produit correspondant.</div>'}</div>`;

function vCatalogue(){
 const L=lines(db.courses).sort((a,b)=>b.c.date.localeCompare(a.c.date)),P={};
 L.forEach(x=>{const k=x.i.name.trim().toLowerCase()+'|'+x.i.unit,p=P[k]||(P[k]={n:x.i.name,unit:x.i.unit,cat:x.i.cat,last:null,lastDate:'',sum:0,q:0,min:Infinity,max:0,place:'',count:0});p.count++;(p.hist=p.hist||[]).push([x.c.date,x.i.price]);p.sum+=x.i.qty*x.i.price;p.q+=x.i.qty;p.min=Math.min(p.min,x.i.price);p.max=Math.max(p.max,x.i.price);if(!p.last){p.last=x.i.price;p.lastDate=x.c.date;p.place=PLACES[x.c.place]+(x.c.lieu?' — '+x.c.lieu:'')}});

function rateOf(s){const h=(s.hist||[]).slice().sort((a,b)=>a[0].localeCompare(b[0]));if(h.length<2)return 0;const days=(Date.parse(h[h.length-1][0])-Date.parse(h[0][0]))/864e5;if(days<=0)return 0;return h.slice(0,-1).reduce((t,x)=>t+x[1],0)/days}

function act(a,d){
  switch(a){
    case 'tab': ui.tab=d.v; ui.courseId=null; ui.modelId=null; document.body.classList.remove('menu-open'); break;
    case 'menuToggle': document.body.classList.toggle('menu-open'); break;
    case 'menuClose': document.body.classList.remove('menu-open'); break;
    case 'newCourse': openC(makeCourse(iso(),'matin',[])); break;
    case 'quick': {
      const p=d.period;
      let c=db.courses.find(x=>x.date===iso()&&x.period===p);
      if(!c){const m=db.models.find(x=>x.kind===p);c=makeCourse(iso(),p,m?strip(m.items):[]);}
      openC(c); break;
    }
    case 'fromModel': {const m=db.models.find(x=>x.id===d.id);openC(makeCourse(iso(),d.period||'hors',m?strip(m.items):[]));break}
    case 'openCourse': ui.tab='courses';ui.courseId=d.id;break;
    case 'closeCourse': ui.courseId=null;break;
    case 'delCourse': if(sure('dc'+d.id)){db.courses=db.courses.filter(c=>c.id!==d.id);ui.courseId=null;toast('Course supprimée')}break;
    case 'dupCourse': {const c=db.courses.find(x=>x.id===d.id);if(c){const n=makeCourse(iso(),c.period,strip(c.items));n.place=c.place;n.lieu=c.lieu;openC(n);toast('Course dupliquée : saisissez les nouveaux montants')}break}
    case 'courseToModel': {
      const c=db.courses.find(x=>x.id===d.id);
      if(c){const m={id:uid(),name:(PERIODS[c.period]||'Course')+' du '+fdate(c.date),kind:MKIND[c.period]?c.period:'autre',notes:'',items:strip(c.items)};db.models.push(m);ui.tab='modeles';ui.courseId=null;ui.modelId=m.id;toast('Modèle créé : renommez-le si besoin')}
      break;
    }
    case 'delItem': {const o=owner(d.kind,d.owner);if(o)o.items=o.items.filter(i=>i.id!==d.iid);break}
    case 'addItem': {
      const name=$('#n_name').value.trim();
      if(!name){toast('Indiquez le nom du produit');break}
      const o=owner(d.kind,d.owner),match=(db.products||[]).find(p=>p.name.trim().toLocaleLowerCase('fr')===name.toLocaleLowerCase('fr'));
      if(o)o.items.push({id:uid(),pid:match?.id||null,name:match?.name||name,qty:num($('#n_qty').value)||1,unit:match?.unit||$('#n_unit').value.trim()||'pièce',est:match?Number(match.ref)||0:num($('#n_est').value),cat:match?.cat||$('#n_cat').value,price:null,bought:false});
      break;
    }
    case 'newModel': {const m={id:uid(),name:'Nouveau modèle',kind:'autre',notes:'',items:[]};db.models.push(m);ui.tab='modeles';ui.modelId=m.id;break}
    case 'openModel': ui.modelId=d.id;break;
    case 'closeModel': ui.modelId=null;break;
    case 'dupModel': {const m=db.models.find(x=>x.id===d.id);if(m){const n={...m,id:uid(),name:m.name+' (copie)',items:m.items.map(i=>({...i,id:uid()}))};db.models.push(n);ui.modelId=n.id}break}
    case 'delModel': if(sure('dm'+d.id)){db.models=db.models.filter(m=>m.id!==d.id);ui.modelId=null;toast('Modèle supprimé')}break;
    case 'addRemise': {
      const amt=num($('#r_amt').value);
      if(amt<=0){toast('Montant invalide');break}
      db.remises.push({id:uid(),date:$('#r_date').value||iso(),amount:amt,comment:$('#r_com').value.trim()});
      toast('Remise enregistrée');break;
    }
    case 'delRemise': if(sure('dr'+d.id)){db.remises=db.remises.filter(r=>r.id!==d.id);toast('Remise supprimée')}break;
    case 'saveBudget': db.settings.budgetMensuel=num($('#bm').value);toast('Budget enregistré');break;
    case 'validateCourse': {const c=db.courses.find(x=>x.id===d.id);if(!c||c.validated)break;const bought=c.items.filter(i=>i.bought&&i.price!=null);if(!bought.length){toast('Aucun article achet\u00e9 \u00e0 valider');break}db.stocks.forEach(s=>{if(!s.last||c.date<=s.last)return;const days=(Date.parse(c.date)-Date.parse(s.last))/864e5;const ex=Math.min(s.qty,Math.round(rateOf(s)*days*100)/100);if(ex>0){s.qty=Math.round((s.qty-ex)*100)/100;s.exits=Math.round((s.exits+ex)*100)/100}});
bought.forEach(i=>{let s=db.stocks.find(x=>x.name.trim().toLowerCase()===i.name.trim().toLowerCase()&&x.unit===i.unit);if(!s){s={id:uid(),name:i.name,qty:0,unit:i.unit,min:0,expiry:'',entries:0,exits:0,last:'',hist:[]};db.stocks.push(s)}if(!s.last||c.date>s.last)s.last=c.date;s.hist=(s.hist||[]).concat([[c.date,i.qty]]);s.qty=Math.round((s.qty+i.qty)*100)/100;s.entries+=i.qty});c.validated=true;toast('Course valid\u00e9e : stocks mis \u00e0 jour');break}
    case 'exportJSON': exportJSON();break;
    case 'exportCSV': exportCSV();break;
    case 'dismissBackup': localStorage.setItem(LB,String(Date.now()));break;
    case 'addCat': {const v=$('#nc').value.trim();if(v&&!cats().includes(v)){db.cats=[...cats(),v]}break}
    case 'delCat': if(sure('dc2'+d.v)){db.cats=cats().filter(x=>x!==d.v)}break;
    case 'addShop': {const n=$('#sh_n').value.trim();if(!n){toast('Nom du magasin requis');break}db.shops.push({id:uid(),name:n,address:$('#sh_a').value.trim(),type:$('#sh_t').value,contact:$('#sh_c').value.trim(),notes:$('#sh_o').value.trim()});break}
    case 'delShop': if(sure('ds'+d.id)){db.shops=db.shops.filter(x=>x.id!==d.id)}break;
    case 'toggleTheme': document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';break;
    case 'addProd': {const n=$('#pr_n').value.trim();if(!n){toast('Nom du produit requis');break}if((db.products||[]).some(p=>p.name.trim().toLocaleLowerCase('fr')===n.toLocaleLowerCase('fr'))){toast('Ce produit existe déjà. Modifie sa fiche dans la liste.');break}db.products=[...(db.products||[]),{id:uid(),name:n,cat:$('#pr_c').value,unit:$('#pr_u').value.trim()||'pièce',ref:num($('#pr_p').value)}];toast('Produit créé');break;}
    case 'resetAll': if(sure('reset')){db=seed();ui.courseId=null;ui.modelId=null;ui.updFor=null;toast('Toutes les données ont été effacées')}break;
    case 'loadDemo': if(sure('demo')){db=demo();ui.courseId=null;ui.modelId=null;ui.updFor=null;toast('Données de démo chargées')}break;
    case 'pickUpd': ui.updFor=d.id;break;
    case 'updModel': if(sure('um'+d.id)){const m=db.models.find(x=>x.id===d.id),c=db.courses.find(x=>x.id===ui.updFor);if(m&&c){m.items=strip(c.items);toast('Modèle mis à jour')}ui.updFor=null}break;
    case 'stockAdd': {const n=$('#s_name').value.trim();if(!n){toast('Nom du produit requis');break}db.stocks.push({id:uid(),name:n,qty:num($('#s_qty').value),unit:$('#s_unit').value.trim()||'pièce',min:num($('#s_min').value),expiry:$('#s_exp').value,entries:0,exits:0,last:iso(),hist:[]});break}
    case 'stockMove': {const s=db.stocks.find(x=>x.id===d.id);const q=num($('#sm_'+d.id).value);if(!s||q<=0){toast('Quantité invalide');break}if(d.dir==='in'){s.qty+=q;s.entries+=q}else{if(q>s.qty){toast('Stock insuffisant');break}s.qty-=q;s.exits+=q}break}
    case 'stockDel': if(sure('sd'+d.id)){db.stocks=db.stocks.filter(x=>x.id!==d.id);toast('Produit retiré du stock')}break;
    case 'stockToCourse': {const low=db.stocks.filter(s=>s.qty<=s.min);if(!low.length){toast('Aucun stock faible');break}openC(makeCourse(iso(),'hors',low.map(s=>ITEM(s.name,Math.max(1,s.min*2-s.qty),s.unit,0,'Autres'))));toast('Liste créée à partir des stocks faibles');break}
    case 'rptMonth': ui.rpt=monthRange(+d.off);break;
    case 'rptDay': ui.rpt={from:iso(),to:iso()};break;
  }
}
function setField(el){
  const d=el.dataset, v=el.type==='checkbox'?el.checked:el.value;
  if(d.set==='item'){
    const o=owner(d.kind,d.owner), i=o&&o.items.find(x=>x.id===d.iid);
    if(!i)return;
    if(d.f==='qty'||d.f==='est') i[d.f]=num(v);
    else if(d.f==='price'){i.price=v===''?null:num(v);if(i.price!==null)i.bought=true}
    else if(d.f==='bought'){i.bought=v;if(v&&i.price==null)i.price=i.est}
  }
  else if(d.set==='course'||d.set==='model'){const o=owner(d.set,d.owner);if(o)o[d.f]=v}
  else if(d.set==='addModel'){const m=db.models.find(x=>x.id===v),c=owner('course',d.owner);if(m&&c)c.items.push(...strip(m.items));if(m)toast('Produits ajoutés')}
  else if(d.set==='prod'){const pr=(db.products||[]).find(x=>x.id===d.owner);if(pr)pr[d.f]=d.f==='ref'?num(v):v}
  else if(d.set==='productQ'){ui.productQ=v}
  else if(d.set==='productSort'){ui.productSort=v}
  else if(d.set==='cq'){ui.catQ=v}
  else if(d.set==='rpt'){ui.rpt[d.f]=v}
  else if(d.set==='filter'){ui.filter[d.f]=v}
  save();render();
}
function render(){

  document.querySelectorAll('.side-link').forEach(b=>b.classList.toggle('active',b.dataset.v===ui.tab));
  const V={accueil:vAccueil,courses:vCourses,modeles:vModeles,historique:vHistorique,budget:vBudget,stocks:vStocks,catalogue:vCatalogue,rapports:vRapports,reglages:vReglages};

document.addEventListener('change',e=>{
  if(e.target.id!=='imp'||!e.target.files||!e.target.files[0])return;
  const file=e.target.files[0];
  if(file.size>10*1024*1024){toast('Sauvegarde trop volumineuse (maximum 10 Mo)');e.target.value='';return}
  if(!confirm('Restaurer cette sauvegarde ? Les données actuelles seront remplacées. Téléchargez une sauvegarde de sécurité avant de continuer.')){e.target.value='';return}
  const reader=new FileReader();
  reader.onerror=()=>toast('Lecture du fichier impossible');
  reader.onload=()=>{
    try{
      const imported=JSON.parse(String(reader.result||''));
      const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
      const arrays=['courses','models','stocks','shops','remises'];
      if(!isObj(imported)||!Array.isArray(imported.courses)||!Array.isArray(imported.models))throw new Error('Structure de sauvegarde invalide');
      for(const key of arrays)if(imported[key]!==undefined&&!Array.isArray(imported[key]))throw new Error('Rubrique invalide : '+key);
      if(!imported.courses.every(c=>isObj(c)&&Array.isArray(c.items))||!imported.models.every(m=>isObj(m)&&Array.isArray(m.items)))throw new Error('Contenu des courses ou modèles invalide');
      const defaults=seed();
      const restored={...defaults,...imported};
      restored.settings={...defaults.settings,...(isObj(imported.settings)?imported.settings:{})};
      restored.stocks=Array.isArray(imported.stocks)?imported.stocks:[];
      restored.shops=Array.isArray(imported.shops)?imported.shops:[];
      restored.remises=Array.isArray(imported.remises)?imported.remises:[];
      restored.cats=Array.isArray(imported.cats)?imported.cats:CATS.slice();
      restored.products=Array.isArray(imported.products)?imported.products:[];
      const before=localStorage.getItem(KEY);
      try{localStorage.setItem(KEY,JSON.stringify(restored));db=restored;localStorage.setItem(LS,'0');save();}
      catch(storageError){if(before===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,before);throw new Error('Espace de stockage insuffisant : données précédentes conservées');}
      ui.courseId=null;ui.modelId=null;ui.updFor=null;ui.tab='accueil';render();toast('Restauration terminée : données importées et enregistrées');
    }catch(err){toast(err.message||'Fichier invalide : restauration annulée')}
    finally{e.target.value=''}
  };
  reader.readAsText(file);
});
document.addEventListener('change',e=>{if(e.target.id!=='n_prod')return;const pr=(db.products||[]).find(x=>x.id===e.target.value);if(!pr)return;$('#n_name').value=pr.name;$('#n_unit').value=pr.unit;$('#n_cat').value=pr.cat;$('#n_est').value=pr.ref||''});

/* ---------- AppForge V3 / D1 / R2 ---------- */
const MADA_CLOUD_API='https://appforge-license-api.lalainaadclick.workers.dev';
const MADA_CLOUD_PRODUCT='MADACOURSES';
const MADA_CLOUD_INSTALL_KEY='madaCourses.cloud.installation.v1';
const MADA_CLOUD_RECORD_KEY='madaCourses.cloud.entitlement.v1';
const madaSecure=window.AppForgeNativeStorage;
const madaStore={
 get:async key=>madaSecure?madaSecure.get(key):localStorage.getItem(key),
 set:async(key,value)=>{if(madaSecure){if(!madaSecure.set(key,value))throw Error('Écriture du stockage Android protégé impossible.')}else localStorage.setItem(key,value)},
 remove:async key=>{if(madaSecure)madaSecure.remove(key);else localStorage.removeItem(key)}
};
function madaCloudMessage(message,error=false){const el=document.getElementById('madaCloudStatus');if(el){el.textContent=message;el.style.borderColor=error?'var(--danger)':'var(--line)';el.style.color=error?'var(--danger)':''}}
async function madaCloudRequest(path,options={},token=''){const headers={...(options.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})};let response;if(window.AndroidBridge&&typeof AndroidBridge.requestNetwork==='function'){const raw=AndroidBridge.requestNetwork(MADA_CLOUD_API+path,options.method||'GET',JSON.stringify(headers),options.body||'');let nativeResult;try{nativeResult=JSON.parse(raw)}catch{throw Error('Transport Android : réponse native invalide')}if(!nativeResult.ok)throw Error(nativeResult.error||'Transport réseau Android échoué');response={ok:nativeResult.status>=200&&nativeResult.status<300,status:nativeResult.status,json:async()=>nativeResult.body||{},headers:{get:()=>nativeResult.contentType||''}};const data=nativeResult.body||{};if(!response.ok){const err=Error(data.error||'Worker AppForge HTTP '+response.status);err.status=response.status;throw err}return{data,response}}else{response=await fetch(MADA_CLOUD_API+path,{...options,headers,cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok){const err=Error(data.error||'Worker AppForge HTTP '+response.status);err.status=response.status;throw err}return{data,response}}}

function madaBytesToBase64(bytes){let binary='';const chunk=8192;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(binary)}
function madaBase64ToBytes(value){const binary=atob(value||'');const out=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)out[i]=binary.charCodeAt(i);return out}
async function madaNativeBinaryRequest(url,method,headers,bytes){if(window.AndroidBridge&&typeof AndroidBridge.requestBinary==='function'){const encoded=bytes?madaBytesToBase64(bytes):'';const raw=AndroidBridge.requestBinary(url,method,JSON.stringify(headers||{}),encoded);let result;try{result=JSON.parse(raw)}catch{throw Error('Transport Android binaire : réponse native invalide')}if(!result.ok)throw Error(result.error||'Transport binaire Android échoué');return{ok:result.status>=200&&result.status<300,status:result.status,headers:{get:name=>name.toLowerCase()==='x-appforge-sha256'?result.sha256Header||'':name.toLowerCase()==='content-type'?result.contentType||'':''},arrayBuffer:async()=>madaBase64ToBytes(result.bodyBase64).buffer,json:async()=>{const bytes=madaBase64ToBytes(result.bodyBase64);return JSON.parse(new TextDecoder().decode(bytes))}}}const response=await fetch(url,{method,headers,body:bytes,cache:'no-store'});return response}

async function madaSecureStorageSelfTest(){if(!madaSecure||typeof madaSecure.get!=='function'||typeof madaSecure.set!=='function'){if(window.AndroidBridge)throw Error('Pont Android détecté mais stockage sécurisé AppForgeNativeStorage absent. Mets à jour/réinstalle l’APK; aucun appel de licence n’a été envoyé.');return{secure:false,ok:true,detail:'Mode HTML localStorage'}};const key='madaCourses.cloud.selftest.v1',value='check-'+Date.now();if(madaSecure.set(key,value)!==true)throw Error('Le stockage Android Keystore a refusé l’écriture du test.');const read=madaSecure.get(key);madaSecure.remove(key);if(read!==value)throw Error('Le stockage Android sécurisé n’a pas restitué la valeur test.');return{secure:true,ok:true,detail:'AES-GCM / Android Keystore validé'} }
async function madaInstallationId(){let id=await madaStore.get(MADA_CLOUD_INSTALL_KEY);if(!id){id=crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');await madaStore.set(MADA_CLOUD_INSTALL_KEY,id)}return id}
async function madaCloudRecord(){const raw=await madaStore.get(MADA_CLOUD_RECORD_KEY);if(!raw)return null;try{return JSON.parse(raw)}catch{throw Error('Les informations de licence Cloud locales sont illisibles. Les données métier restent intactes.')}}
async function madaSaveCloudRecord(record){await madaStore.set(MADA_CLOUD_RECORD_KEY,JSON.stringify(record))}
async function madaActivateLicense(){const field=document.getElementById('madaLicenseCode'),code=String(field?.value||'').trim().toUpperCase();if(code.length<12||code.length>80)throw Error('Saisis un code de licence valide (12 à 80 caractères).');await madaSecureStorageSelfTest();madaCloudMessage('Vérification et activation de la licence…');const installationId=await madaInstallationId();const {data}=await madaCloudRequest('/v1/activate',{method:'POST',body:JSON.stringify({productId:MADA_CLOUD_PRODUCT,code,installationId})});if(!data.token||!data.cloudAccess?.token)throw Error('Réponse Worker incomplète : jeton licence ou Cloud manquant.');await madaSaveCloudRecord({version:1,productId:MADA_CLOUD_PRODUCT,installationId,licenseToken:data.token,cloudToken:data.cloudAccess.token,cloudExpiresAt:data.cloudAccess.expiresAt||null,activatedAt:new Date().toISOString(),expiresAt:data.expiresAt||null,kind:'license'});if(field)field.value='';madaCloudMessage('Licence activée. Vérification du statut et Cloud…');await madaCloudQuota();return data}
async function madaStartTrial(){await madaSecureStorageSelfTest();madaCloudMessage('Demande de l’essai 72 h au Worker…');const installationId=await madaInstallationId();const {data}=await madaCloudRequest('/v1/trial',{method:'POST',body:JSON.stringify({productId:MADA_CLOUD_PRODUCT,installationId})});if(!data.token||!data.cloudAccess?.token)throw Error('Réponse Worker incomplète : jeton d’essai ou Cloud manquant.');await madaSaveCloudRecord({version:1,productId:MADA_CLOUD_PRODUCT,installationId,licenseToken:data.token,cloudToken:data.cloudAccess.token,cloudExpiresAt:data.cloudAccess.expiresAt||null,startedAt:data.startedAt,expiresAt:data.expiresAt,kind:'trial'});madaCloudMessage('Essai enregistré. Vérification du statut Cloud…');await madaCloudQuota();return data}
async function madaCloudToken(force=false){const record=await madaCloudRecord();if(!record?.licenseToken)throw Error('Active d’abord l’essai 72 h ou une licence AppForge.');const installationId=await madaInstallationId();const {data:status}=await madaCloudRequest('/v1/status',{method:'POST',body:JSON.stringify({productId:MADA_CLOUD_PRODUCT,token:record.licenseToken,installationId})});if(!status.active)throw Error(status.error||'Licence ou essai inactif.');if(!force&&record.cloudToken&&Date.parse(record.cloudExpiresAt||'')>Date.now()+60000)return record.cloudToken;const {data}=await madaCloudRequest('/v1/cloud/token',{method:'POST',body:JSON.stringify({productId:MADA_CLOUD_PRODUCT,installationId,licenseToken:record.licenseToken})});if(!data.token)throw Error('Renouvellement du jeton Cloud refusé.');record.cloudToken=data.token;record.cloudExpiresAt=data.expiresAt||null;await madaSaveCloudRecord(record);return data.token}
function madaCloudSnapshot(){return{schema:1,appId:'mada-courses',data:JSON.parse(JSON.stringify(db))}}
async function madaReadCloudSnapshot(){const token=await madaCloudToken();const {data}=await madaCloudRequest('/v1/cloud/snapshot?resource=default',{},token);const size=data.snapshot?new TextEncoder().encode(JSON.stringify(data.snapshot)).length:0;madaCloudMessage(data.snapshot?'Sauvegarde Cloud trouvée · révision '+data.revision+' · '+Math.ceil(size/1024)+' Ko.':'Aucune sauvegarde Cloud. La copie locale est intacte.');return{token,...data}}
async function madaPushCloud(){const {token,...remote}=await madaReadCloudSnapshot();const local=madaCloudSnapshot();if(remote.snapshot&&!confirm('Une sauvegarde Cloud existe déjà (révision '+remote.revision+'). Remplacer cette copie par les données locales ? Aucune fusion automatique ne sera effectuée.'))return;if(new TextEncoder().encode(JSON.stringify(local)).length>440000)throw Error('Sauvegarde supérieure à 440 Ko. Réduis les données avant l’envoi.');const {data}=await madaCloudRequest('/v1/cloud/snapshot?resource=default',{method:'PUT',body:JSON.stringify({expectedRevision:Number(remote.revision||0),snapshot:local})},token);madaCloudMessage('Sauvegarde D1 envoyée avec succès · révision '+data.revision+'.');}
async function madaRestoreCloud(){const {token,...remote}=await madaReadCloudSnapshot();if(!remote.snapshot)throw Error('Aucune sauvegarde Cloud disponible.');if(remote.snapshot.schema!==1||remote.snapshot.appId!=='mada-courses'||!remote.snapshot.data||typeof remote.snapshot.data!=='object'||Array.isArray(remote.snapshot.data))throw Error('Format de sauvegarde Cloud non reconnu.');if(!confirm('Restaurer la sauvegarde Cloud ? Une copie locale de sécurité sera téléchargée avant le remplacement.'))return;download('mada-courses-before-cloud-restore-'+iso()+'.json','application/json',JSON.stringify(db,null,2));const restored=remote.snapshot.data;if(!Array.isArray(restored.courses)||!Array.isArray(restored.models))throw Error('Données Cloud invalides : courses ou modèles absents.');localStorage.setItem(KEY,JSON.stringify(restored));db=load();ui.courseId=null;ui.modelId=null;ui.tab='accueil';save();render();madaCloudMessage('Restauration terminée. Copie locale de sécurité téléchargée.');}
async function madaR2Smoke(){const token=await madaCloudToken();const fileId='mada-courses-r2-smoke';const {data:list}=await madaCloudRequest('/v1/cloud/files',{},token);const old=(list.items||[]).find(x=>x.fileId===fileId);const expected=Number(old?.revision||0);const bytes=new TextEncoder().encode(JSON.stringify({test:'Mada Courses R2',productId:MADA_CLOUD_PRODUCT,at:new Date().toISOString(),nonce:crypto.randomUUID?crypto.randomUUID():String(Date.now())}));const sha=async value=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',value)),x=>x.toString(16).padStart(2,'0')).join('');const localHash=await sha(bytes);const put=await madaNativeBinaryRequest(MADA_CLOUD_API+'/v1/cloud/file?fileId='+encodeURIComponent(fileId),'PUT',{Authorization:'Bearer '+token,'X-AppForge-Expected-Revision':String(expected),'Content-Type':'application/octet-stream'},bytes);const saved=await put.json().catch(()=>({}));if(!put.ok)throw Error(saved.error||'Upload R2 HTTP '+put.status);const get=await madaNativeBinaryRequest(MADA_CLOUD_API+'/v1/cloud/file?fileId='+encodeURIComponent(fileId),'GET',{Authorization:'Bearer '+token},null);if(!get.ok)throw Error('Téléchargement R2 HTTP '+get.status);const received=new Uint8Array(await get.arrayBuffer()),downloadHash=await sha(received),headerHash=get.headers.get('X-AppForge-SHA256');if(localHash!==downloadHash||localHash!==headerHash||saved.sha256!==localHash)throw Error('Contrôle SHA-256 incorrect après téléchargement.');madaCloudMessage('Test R2 réussi : upload, téléchargement et SHA-256 identiques · révision '+saved.revision+'.');}
async function madaR2UploadSelectedFile(){const input=document.getElementById('madaR2File'),file=input?.files?.[0];if(!file)throw Error('Choisis d’abord un fichier à envoyer.');const maxBytes=10*1024*1024;if(file.size<=0)throw Error('Le fichier est vide.');if(file.size>maxBytes)throw Error('Fichier trop volumineux : limite 10 Mio.');const token=await madaCloudToken(),installationId=await madaInstallationId();const safeInstall=installationId.replace(/[^A-Za-z0-9_-]/g,'').slice(0,18)||'device';const fileId='mada-file-test-'+safeInstall;const {data:list}=await madaCloudRequest('/v1/cloud/files',{},token);const existing=(list.items||[]).find(x=>x.fileId===fileId);const expectedRevision=Number(existing?.revision||0);madaCloudMessage('Calcul SHA-256 et envoi du fichier « '+file.name+' »…');const bytes=await file.arrayBuffer();const sha=async value=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',value)),x=>x.toString(16).padStart(2,'0')).join('');const localHash=await sha(bytes);const put=await madaNativeBinaryRequest(MADA_CLOUD_API+'/v1/cloud/file?fileId='+encodeURIComponent(fileId),'PUT',{Authorization:'Bearer '+token,'X-AppForge-Expected-Revision':String(expectedRevision),'Content-Type':'application/octet-stream'},bytes);const saved=await put.json().catch(()=>({}));if(!put.ok)throw Error(saved.error||'Upload R2 HTTP '+put.status);const get=await madaNativeBinaryRequest(MADA_CLOUD_API+'/v1/cloud/file?fileId='+encodeURIComponent(fileId),'GET',{Authorization:'Bearer '+token},null);if(!get.ok)throw Error('Téléchargement R2 HTTP '+get.status);const received=await get.arrayBuffer(),downloadHash=await sha(received),headerHash=get.headers.get('X-AppForge-SHA256');if(localHash!==downloadHash||localHash!==headerHash||saved.sha256!==localHash)throw Error('Échec du contrôle SHA-256 : le fichier téléchargé ne correspond pas à l’original.');const blob=new Blob([received],{type:file.type||'application/octet-stream'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=file.name;link.style.display='none';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);madaCloudMessage('Test R2 réussi : « '+file.name+' » · '+file.size.toLocaleString('fr-FR')+' octets · upload + téléchargement vérifiés · SHA-256 identique · révision '+saved.revision+'. Le fichier téléchargé est enregistré dans les Téléchargements sur Android.');await madaCloudQuota();}
async function madaCloudQuota(){const token=await madaCloudToken();const {data}=await madaCloudRequest('/v1/cloud/quota',{},token);const d=data.d1||{},r=data.r2||{};const box=document.getElementById('madaCloudQuota');if(box)box.innerHTML='<div class="kpi"><small>D1 utilisé / max.</small><b>'+Number(d.usedBytes||0).toLocaleString('fr-FR')+' / '+Number(d.maxBytes||0).toLocaleString('fr-FR')+' o</b></div><div class="kpi"><small>R2 fichiers</small><b>'+Number(r.fileCount||0)+' / '+Number(r.maxFiles||0)+'</b></div><div class="kpi"><small>R2 utilisé / max.</small><b>'+Number(r.usedBytes||0).toLocaleString('fr-FR')+' / '+Number(r.maxBytes||0).toLocaleString('fr-FR')+' o</b></div>';madaCloudMessage('Quotas actualisés depuis le Worker. R2 '+(r.available?'disponible':'indisponible')+'.');}
document.addEventListener('click',e=>{const button=e.target.closest('[data-cloud]');if(!button)return;const action=button.dataset.cloud;button.disabled=true;Promise.resolve().then(async()=>{if(action==='activate')await madaActivateLicense();else if(action==='trial')await madaStartTrial();else if(action==='read')await madaReadCloudSnapshot();else if(action==='push')await madaPushCloud();else if(action==='restore')await madaRestoreCloud();else if(action==='r2')await madaR2Smoke();else if(action==='upload-file')await madaR2UploadSelectedFile();else if(action==='quota')await madaCloudQuota()}).catch(error=>madaCloudMessage(error.message||'Erreur Cloud inconnue.',true)).finally(()=>{button.disabled=false})});
function applyBranding(){const title=document.getElementById('brandTitle'),mark=document.getElementById('brandMark');if(title)title.textContent=db.settings.appName||'MADA COURSES';if(mark){const photo=db.settings.brandPhoto;if(photo){mark.innerHTML='<img alt="Logo" src="'+photo+'">';mark.classList.add('has-photo')}else{mark.textContent='🛒';mark.classList.remove('has-photo')}}}
async function pinDigest(pin,salt){const enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']),bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:210000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('')}
function showPinLock(){if(!db.settings.pinEnabled||!db.settings.pinHash)return;const el=document.getElementById('pinLock');if(el){el.hidden=false;const bio=document.getElementById('unlockBioBtn');if(bio)bio.hidden=!db.settings.biometricEnabled}}
async function verifyPin(){const input=document.getElementById('unlockPin'),msg=document.getElementById('pinError');try{if(await pinDigest(input.value,db.settings.pinSalt)===db.settings.pinHash){document.getElementById('pinLock').hidden=true;input.value='';msg.textContent=''}else{msg.textContent='Code incorrect';input.value=''}}catch(e){msg.textContent='Vérification indisponible.'}}
window.onBiometricResult=ok=>{if(ok){const lock=document.getElementById('pinLock');if(lock)lock.hidden=true;const err=document.getElementById('pinError');if(err)err.textContent=''}else{const err=document.getElementById('pinError');if(err)err.textContent='Authentification biométrique non validée.'}};
function applyBrandPhoto(file){if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>2*1024*1024){toast('Image invalide : JPEG, PNG ou WebP, 2 Mo maximum.');return}const r=new FileReader();r.onerror=()=>toast('Lecture de la photo impossible');r.onload=()=>{db.settings.brandPhoto=String(r.result);save();applyBranding();toast('Photo d’accueil enregistrée.')}}
function madaCloudRenderSecureLabel(){const label=document.getElementById('madaCloudSecure');if(!label)return;const native=!!(madaSecure&&typeof madaSecure.get==='function'&&typeof madaSecure.set==='function');label.textContent=native?'Stockage protégé Android : AES-GCM / Android Keystore (testé avant activation).':'Mode HTML : localStorage (non chiffré).';}
